name: 每日盤後資料抓取與部署

on:
  schedule:
    # UTC 07:35 = 台北 15:35 (週一至週五)。此時期交所/證交所盤後資料已公布完畢,
    # 一抓即到、不需長時間重試。腳本內含休市判斷與 30 分鐘重試作為保險,非交易日自動略過。
    # 註:GitHub 免費排程為「盡力而為」,實際觸發常延後到傍晚, 屬正常現象。
    - cron: "35 7 * * 1-5"
    # 備援班次 UTC 13:35 = 台北 21:35:主班次被 GitHub 跳過時的保險 (2026/07/09 即發生過)。
    # 同日重跑僅覆蓋當日資料、不影響歷史;若主班次已成功, 此班次抓到相同資料, 無資料變更即不 commit。
    - cron: "35 13 * * 1-5"
    # 補位班次 (2026/11/10 加):台北 16:05~20:05、22:05、23:05 每小時一次。
    # GitHub 排程近期常延遲 4~15 小時甚至整個不來 (11/09 兩班都遲到、11/10 的 15:35 到 23 點都沒出現),
    # 只靠上面兩班, 運氣不好整天沒資料、沒信。補位班次先跑 check:資料已齊全就整個略過 (不抓、不部署、不重寄)。
    # 改這幾行 cron 字串時, 下面 check job 的判斷也要一起改。
    - cron: "5 8-12,14-15 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "手動指定日期 YYYY/MM/DD (留空=今天)"
        required: false
      no_retry:
        description: "略過 30 分鐘重試 (true/false)"
        required: false
        default: "false"

# Pages 官方部署所需權限 (較「分支自動部署」穩定)
permissions:
  contents: write   # 允許 commit 回 main
  pages: write      # 允許部署 GitHub Pages
  id-token: write   # 部署身分驗證

concurrency:
  group: daily-postmarket
  cancel-in-progress: false

jobs:
  # ① 這班要不要跑?  手動觸發、15:35 主班次、21:35 備援 → 一律跑;補位班次 → 資料已齊全就略過。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.s.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |       # 只拿判斷要用的小檔, 不拉整個 repo (完整 checkout 要 1 分鐘)
            scrape.py
            tools/
            data/*.json
            data/holidays.txt
          sparse-checkout-cone-mode: false
      - id: s
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] \
             || [ "${{ github.event.schedule }}" = "35 7 * * 1-5" ] \
             || [ "${{ github.event.schedule }}" = "35 13 * * 1-5" ]; then
            echo "run=true" >> $GITHUB_OUTPUT; echo "主班次/備援/手動 → 一律執行"; exit 0
          fi
          python3 tools/status.py | tee st.txt
          if grep -q "^done=true" st.txt; then
            echo "run=false" >> $GITHUB_OUTPUT; echo "資料已齊全 → 本補位班次略過"
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

  # ② 抓資料 + commit。與部署拆開:2026/11/09~10 連續三次「Deploy to GitHub Pages」逾時,
  #    以前抓取與部署同一個 job, 部署失敗 = 整個 workflow 失敗 = report.yml 不寄信 (資料其實早已 commit)。
  scrape:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
      RETRY_WAIT: "1800"   # 30 分鐘
      MAX_RETRY: "6"       # 最多重試 6 次 (約 3 小時)
    steps:
      # ref: main — 取職務開跑當下的最新版, 避免佇列等待期間基底過期導致 rebase 衝突
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 執行抓取
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.no_retry }}" = "true" ]; then ARGS="$ARGS --no-retry"; fi
          python scrape.py $ARGS

      - name: 產生主力6-10大策略追蹤資料
        continue-on-error: true
        run: |
          pip install --quiet pandas numpy
          python tools/strategy610.py

      # 盤後籌碼快報 (報告第一張圖) 的資料:證交所/櫃買/期交所當日數字 + 歷史回補 → data/flash.json
      # 掛了不影響其他資料; 證交所三大法人 15:35 常未公布, 備援班次會補上 (報告會因完整度指紋改變而補寄)。
      - name: 盤後籌碼快報資料
        continue-on-error: true
        timeout-minutes: 20
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          python tools/flash.py collect $ARGS

      - name: Commit 資料更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MSG="資料更新 $(date -u -d '+8 hour' '+%Y/%m/%d %H:%M') (台北)"
          git add -A data/
          if git diff --cached --quiet; then
            echo "無資料變更 (可能為非交易日或資料未更新)"; exit 0
          fi
          git commit -m "$MSG"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin main && exit 0
            else
              git rebase --abort || true
            fi
            echo "push 失敗, 10 秒後重試 ($i/3)"; sleep 10
          done
          exit 1

  # ③ 部署網站。重新 checkout main (含剛 commit 的資料)。
  #    11/09~10 Pages 後端卡住:deployment_queued 排隊 ~5 分 + syncing_files 一直不結束 → 10 分鐘逾時。
  #    11/10 實測:逾時取消後等 1 分鐘重新部署, 44 秒就成功 → 失敗就重試, 最多 3 次。
  #    部署成敗不影響寄信 (report.yml 在來源 failure 時也會跑)。
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 準備網站檔案
        run: |
          rm -rf _site && mkdir -p _site
          cp -r index.html stocks.html detail.html stock.html rank.html concept.html screener.html strategy.html help.html analysis.html assets data .nojekyll _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

      - name: 部署失敗 → 等 1 分鐘重試
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (重試)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

      - name: 第二次也失敗 → 等 2 分鐘再試最後一次
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (最後一次)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000

# 部署方式:GitHub 官方 Actions 部署 (Settings → Pages → Source 設為 "GitHub Actions")。
# 每次工作流程執行都會直接把最新網站內容部署上去, 不再依賴不穩定的分支自動部署;
# 即使某次失敗, 下一次執行也會自動補上。固定網址: https://<帳號>.github.io/<倉庫名>/
