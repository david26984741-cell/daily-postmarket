# .github/workflows/exright_daily.yml
#
# 每日增量 —— 只抓當月, 偵測到新事件時重算還原因子。
# 若你想併進既有的每日 workflow, 把 steps 直接搬過去即可。

name: 除權息每日增量

on:
  schedule:
    - cron: "30 7 * * 1-5"        # UTC 07:30 = 台北 15:30, 收盤後
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓當月除權息 (覆蓋既有同鍵資料)
        env:
          EXRIGHT_SLEEP: "3.2"
        run: |
          YM=$(TZ=Asia/Taipei date +%Y-%m)
          python scrape_exright.py --market both --start "$YM" --end "$YM" --no-resume

      - name: 重算還原因子
        run: python build_adjfactor.py

      - name: 驗收測試 (回歸保護)
        run: python test_exright.py | tee acceptance_report.txt

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exright data/adjfactor
          git diff --staged --quiet || git commit -m "除權息每日增量 $(TZ=Asia/Taipei date +%F)"
          git push
