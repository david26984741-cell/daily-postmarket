name: 每日股期報告

# 「每日盤後資料抓取與部署」一跑完就自動接著跑 (workflow_run 事件觸發, 非定時輪詢),
# 所以不論是排程 15:35 主班次、21:35 備援, 還是手動 Run workflow, 報告都會緊接著寄出。
# 來源成功或失敗都會接著跑 (部署失敗不擋寄信); 同一份資料只寄一次 (用 cache 防重複, 避免多個班次各寄一封)。
# 注意: 本 repo 為公開, 報告不寫檔、不 commit、不部署, 僅在記憶體處理後寄出。

on:
  workflow_run:
    workflows: ["每日盤後資料抓取與部署"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "忽略防重複, 強制再寄一次 (測試用填 yes)"
        required: false
        default: "no"

permissions:
  contents: read

concurrency:
  group: daily-postmarket-report
  cancel-in-progress: false

jobs:
  report:
    # workflow_run: 來源 workflow「成功或失敗」都接著跑 (取消/略過不跑);手動觸發一律執行。
    # 2026/11/10 改:以前只在成功時寄, 結果「網站部署」逾時 → workflow 失敗 → 不寄信,
    # 但資料其實早已 commit。現在部署失敗不影響寄信;真的沒抓到新資料時,
    # 下面的「防重複」(資料日期 + 完整度指紋) 會判定已寄過而略過, 不會重寄舊資料。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    # 2026/11/06 事故:ubuntu-latest 開始換成 Ubuntu 26.04, 安裝步驟卡死 12 分鐘被砍 → 整封信沒有附圖。
    # 固定 24.04 (11/05 以前都在這版本跑, 安裝約 1 分鐘)。要升級時先手動 force 測過再改。
    runs-on: ubuntu-24.04
    # 2026/08/19 事故:安裝步驟(Chromium + apt 相依)在 runner 慢的日子跑了 9m16s,
    # 撞上原本的 10 分鐘上限被 cancel → 三次班次全部沒寄信, 而且不會有任何錯誤通知。
    # 上限放寬到 25 分鐘當保險;真正的解法是下面那個相依套件快取。
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # 取開跑當下最新版 (資料已由來源 workflow commit)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 讀取資料日期與內容指紋
        id: d
        run: |
          echo "date=$(python -c "import json;print(json.load(open('data/rank.json'))['date'].replace('/','-'))")" >> $GITHUB_OUTPUT
          echo "sig=$(python tools/report.py --sig)" >> $GITHUB_OUTPUT

      # 防重複的 key 同時看「資料日期」與「內容指紋」:
      #   同一天資料沒變 → 指紋相同 → 快取命中 → 不重寄 (主班次+備援不會各寄一封)
      #   同一天資料補齊 → 指紋改變 → 快取落空 → 重寄一封正確的
      # 為什麼要這樣:15:35 主班次常抓不到證交所現貨(BFI82U 公布得比較晚), 先寄了缺圖的信;
      # 21:35 備援補到資料後, 舊做法會因為「今天寄過了」而不再寄 —— 網站是對的、信卻永遠是錯的。
      - name: 防重複 (同一份資料只寄一次;資料有更新則重寄)
        id: sent
        uses: actions/cache@v4
        with:
          path: .sent
          key: report-sent-${{ steps.d.outputs.date }}-${{ steps.d.outputs.sig }}

      # 相依套件快取: pip 輪子 + Playwright 的 Chromium(約 150MB)。
      # 不快取的話每天重下, 慢的日子整步驟要 9 分鐘以上 (2026/08/19 就是這樣被 timeout 砍掉)。
      # key 固定不帶 hash — 這些相依很穩定, 要強制更新就把 v1 改成 v2。
      - name: 相依套件快取 (pip / Chromium)
        if: steps.sent.outputs.cache-hit != 'true' || github.event.inputs.force == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: report-deps-${{ runner.os }}-v1

      # 中文字型檔 (Noto Sans CJK, 約 40MB) 也快取起來。
      # 2026/11/24 事故:Ubuntu 套件鏡像只有 ~300 kB/s, apt 下載 61MB 的 fonts-noto-cjk 撞到 240 秒上限,
      # 腳本中斷 → 排在後面的 matplotlib 也沒裝 → 附圖 0~4、9 全部失敗, 信裡只剩 4 張排行截圖。
      - name: 中文字型快取
        id: fontcache
        if: steps.sent.outputs.cache-hit != 'true' || github.event.inputs.force == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/noto-cjk
          key: report-font-noto-cjk-v1

      # matplotlib + 中文字型:附圖 0~4、9 都靠它。
      #   ① 先裝 matplotlib (PyPI, 快且有 pip 快取), 不再排在字型後面被連坐。
      #   ② 字型優先用快取;沒有才從 GitHub 官方 noto-cjk repo 直接下載 .ttc (GitHub→GitHub 很快),
      #      最後才退回 apt (慢、會卡)。都失敗也照樣畫圖 (中文變方塊), 不讓整張圖消失。
      - name: 安裝 matplotlib 與中文字型
        if: steps.sent.outputs.cache-hit != 'true' || github.event.inputs.force == 'yes'
        timeout-minutes: 10
        continue-on-error: true    # 裝不起來只是沒附圖, 信照寄
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set +e
          timeout 300 pip install --quiet matplotlib || echo "::warning::matplotlib 安裝失敗"
          D=~/.cache/noto-cjk; mkdir -p "$D"
          RAW=https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTC
          for w in Regular Bold; do
            f="$D/NotoSansCJK-$w.ttc"
            if [ ! -s "$f" ]; then
              timeout 180 curl -fsSL --retry 3 --retry-delay 5 -o "$f.part" "$RAW/NotoSansCJK-$w.ttc" \
                && head -c4 "$f.part" | grep -q ttcf && mv "$f.part" "$f" || { rm -f "$f.part"; echo "下載 $w 失敗"; }
            fi
          done
          if [ ! -s "$D/NotoSansCJK-Regular.ttc" ]; then
            echo "::warning::GitHub 下載字型失敗, 退回 apt"
            timeout 420 sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk \
              && cp /usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold}.ttc "$D/" 2>/dev/null
          fi
          sudo mkdir -p /usr/share/fonts/opentype/noto && sudo cp "$D"/*.ttc /usr/share/fonts/opentype/noto/ 2>/dev/null
          fc-cache -f >/dev/null
          ls -la "$D"; fc-list :lang=zh family | head -3
          python -c "import matplotlib; print('matplotlib', matplotlib.__version__)"

      # Playwright + Chromium:只有排行截圖 5~8 需要。
      # Chromium 本體走 Playwright 自己的 CDN 且有快取;系統函式庫 runner 映像檔多半已具備 (內建 Google Chrome),
      # 先試著直接啟動, 真的缺函式庫才跑 install-deps (那一步走 apt, 11/24 花了將近 7 分鐘)。
      - name: 安裝 Playwright (排行截圖用)
        if: steps.sent.outputs.cache-hit != 'true' || github.event.inputs.force == 'yes'
        timeout-minutes: 12
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 180 pip install --quiet playwright
          timeout 300 python -m playwright install chromium
          if python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()"; then
            echo "Chromium 可直接啟動, 略過 install-deps"
          else
            echo "缺系統函式庫 → install-deps"
            timeout 540 sudo -E env "PATH=$PATH" python -m playwright install-deps chromium
          fi

      # 圖 0: 盤後籌碼快報 — 讀 data/flash.json (daily.yml 已抓好), 檔名 0_ 排在信件第一張
      - name: 產生盤後籌碼快報 (1 張)
        id: flash
        if: steps.sent.outputs.cache-hit != 'true' || github.event.inputs.force == 'yes'
        continue-on-error: true
        run: python tools/flash.py render --out .shots

      # 圖 1~4: 直接讀 data/*.json 自己畫 (不截網頁 → 不受版面限制、不必等部署)
      - name: 產生圖表 (4 張)
        id: charts
        if: steps.sent.outputs.cache-hit != 'true' || github.event.inputs.force == 'yes'
        continue-on-error: true
        run: python tools/charts.py --out .shots --days 60

      # 圖 5: 增減排行四宮格 — 表格型, 仍以網頁截圖處理
      - name: 產生排行截圖 (4 張)
        id: shots
        if: steps.sent.outputs.cache-hit != 'true' || github.event.inputs.force == 'yes'
        continue-on-error: true
        run: python tools/shots.py --out .shots

      # 圖 6: 選擇權籌碼 (OI 金額變化分布) — runner 即時抓期交所/證交所當日資料, 不進 repo
      - name: 產生選擇權籌碼圖 (1 張)
        id: optchips
        if: steps.sent.outputs.cache-hit != 'true' || github.event.inputs.force == 'yes'
        continue-on-error: true
        run: python tools/optchips.py --fetch --out .shots

      - name: 產生並寄出報告
        if: steps.sent.outputs.cache-hit != 'true' || github.event.inputs.force == 'yes'
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          SHOTS_DIR: .shots
        run: |
          python tools/report.py
          mkdir -p .sent && date > .sent/ok

      # 供除錯: 在 Actions 頁面可直接下載當次截圖, 不進 repo
      - name: 保留圖片供檢視 (artifact)
        if: always() && (steps.flash.outcome == 'success' || steps.charts.outcome == 'success' || steps.shots.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ steps.d.outputs.date }}
          path: .shots/
          # 必要: v4 預設排除「.」開頭的隱藏目錄, 不加這行會 "No files were found"
          include-hidden-files: true
          retention-days: 7

      - name: 已寄過就略過
        if: steps.sent.outputs.cache-hit == 'true' && github.event.inputs.force != 'yes'
        run: echo "資料日期 ${{ steps.d.outputs.date }} 今日已寄過報告, 略過。"
